name: Build APK

on:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y unzip wget
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          wget -q -O /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf /tmp/android-clt
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-clt
          rm -rf "$HOME/android-sdk/cmdline-tools/latest"
          mv /tmp/android-clt/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          # The runner image already sets ANDROID_SDK_ROOT to a different SDK.
          # Gradle fails if ANDROID_HOME and ANDROID_SDK_ROOT disagree.
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"
          # `yes` exits with SIGPIPE; do not use pipefail on this pipeline.
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build web dashboard
        run: |
          npm install
          npm run build

      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
        run: chmod +x ./gradlew && ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: home-dashboard-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
